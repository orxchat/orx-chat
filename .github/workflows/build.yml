name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.btchat --project-name orx_chat .
      - run: sed -i '/<application/e cat permissions.xml' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's/android:label="[^"]*"/android:label="orx chat"/' android/app/src/main/AndroidManifest.xml
      - run: sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 26/' android/app/build.gradle*
      - run: python3 patch_gradle.py
      - run: |
          R=android/app/src/main/res
          cp ic48.png $R/mipmap-mdpi/ic_launcher.png
          cp ic72.png $R/mipmap-hdpi/ic_launcher.png
          cp ic96.png $R/mipmap-xhdpi/ic_launcher.png
          cp ic144.png $R/mipmap-xxhdpi/ic_launcher.png
          cp ic192.png $R/mipmap-xxxhdpi/ic_launcher.png
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: orx-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Dart errors
        if: always()
        continue-on-error: true
        run: |
          flutter analyze --no-pub 2>&1 | grep -E "^\s*error" | head -100 > errors.txt || true
          echo '### Dart errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat errors.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: APK permissions
        if: always()
        continue-on-error: true
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions build/app/outputs/flutter-apk/app-release.apk > perms.txt || true
          echo '### APK permissions' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat perms.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
