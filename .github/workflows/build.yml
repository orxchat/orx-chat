name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.btchat --project-name orx_chat .
      - run: sed -i '/<application/e cat permissions.xml' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's/android:label="[^"]*"/android:label="orx chat"/' android/app/src/main/AndroidManifest.xml
      - run: sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 26/' android/app/build.gradle*
      - run: python3 patch_gradle.py
      - name: Firebase config
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON is missing"; exit 1; fi
          if printf '%s' "$GSJ" | head -c1 | grep -q '{'; then
            printf '%s' "$GSJ" > android/app/google-services.json
          else
            printf '%s' "$GSJ" | base64 -d > android/app/google-services.json
          fi
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));print('Firebase package:',d['client'][0]['client_info']['android_client_info']['package_name'])"
          python3 patch_firebase.py
      - name: Custom notification sounds
        run: python3 patch_sound.py
      - run: |
          R=android/app/src/main/res
          cp ic48.png $R/mipmap-mdpi/ic_launcher.png
          cp ic72.png $R/mipmap-hdpi/ic_launcher.png
          cp ic96.png $R/mipmap-xhdpi/ic_launcher.png
          cp ic144.png $R/mipmap-xxhdpi/ic_launcher.png
          cp ic192.png $R/mipmap-xxxhdpi/ic_launcher.png
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - name: Prepare Android SDK
        continue-on-error: true
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          for i in 1 2 3; do
            $SDKM "platforms;android-36" "build-tools;36.0.0" && break
            echo "retry $i"; sleep 10
          done
      - name: Build APK
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "build failed, retry $i"; sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: orx-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # النشر العام: بس لما تضغط "Run workflow" يدوياً (مش مع كل رفع للكود)
      - name: Name the APK for release
        if: success() && github.event_name == 'workflow_dispatch'
        run: cp build/app/outputs/flutter-apk/app-release.apk orx-chat.apk
      - name: Publish APK to GitHub Releases
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ORX Chat build ${{ github.run_number }}
          files: orx-chat.apk
          make_latest: true
      - name: Dart errors
        if: always()
        continue-on-error: true
        run: |
          flutter analyze --no-pub 2>&1 | grep -E "^\s*error" | head -100 > errors.txt || true
          echo '### Dart errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat errors.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: APK permissions
        if: always()
        continue-on-error: true
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions build/app/outputs/flutter-apk/app-release.apk > perms.txt || true
          echo '### APK permissions' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat perms.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
