name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.btchat --project-name orx_chat .
      - run: sed -i '/<application/e cat permissions.xml' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's/android:label="[^"]*"/android:label="orx chat"/' android/app/src/main/AndroidManifest.xml
      - run: sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 26/' android/app/build.gradle*
      - run:       - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystoreflutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: orx-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
